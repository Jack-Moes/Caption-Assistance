<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #02040b; overflow: hidden; }
  .wrap { position: relative; width: 100vw; height: 100vh; transform-origin: center center;
          animation: caIn .8s cubic-bezier(.22, .61, .36, 1) both; will-change: transform, opacity; }
  /* fade + gentle scale settle-in; will-change promotes it to a GPU layer so the
     scale is a compositor transform (no per-frame video re-raster -> no jank) */
  @keyframes caIn { from { opacity: 0; transform: scale(1.035); } to { opacity: 1; transform: scale(1); } }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
          transform: translateZ(0); backface-visibility: hidden; }

  .shade { position: absolute; inset: 0; z-index: 1; pointer-events: none;
           background: radial-gradient(circle at 50% 46%, rgba(4, 9, 22, .05), rgba(2, 4, 11, .56) 82%),
                       linear-gradient(180deg, rgba(2, 4, 11, .04), rgba(2, 4, 11, .30)); }
  .brand { position: absolute; z-index: 2; left: 50%; top: 52%; transform: translate(-50%, -50%);
           width: 90%; text-align: center; color: #f6fbff; user-select: none;
           font-family: "Segoe UI", system-ui, sans-serif; text-shadow: 0 3px 30px rgba(0, 0, 0, .78); }
  .brand-title { font-size: clamp(34px, 5.8vw, 70px); line-height: 1; font-weight: 750;
                 letter-spacing: -.045em; }
  .brand-title .accent { color: #8f8cff; }
  .tag { margin-top: 13px; color: rgba(225, 238, 255, .78); font-size: clamp(11px, 1.35vw, 17px);
         font-weight: 500; letter-spacing: .22em; text-transform: uppercase; }

  /* 5-dot orbit spinner kept alive over the video (slow at top, fast at bottom) */
  .spinner { position: absolute; left: 50%; bottom: 15%; transform: translate(-50%, 50%) scale(.9);
             width: 44px; height: 44px; z-index: 3; }
  .spinner i {
    position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px;
    border-radius: 50%; background: #eafdff; box-shadow: 0 0 8px rgba(150, 235, 255, .85);
    animation: caOrbit 1.5s cubic-bezier(.4, .2, .6, .8) infinite;
  }
  .spinner i:nth-child(1) { animation-delay: 0s;    }
  .spinner i:nth-child(2) { animation-delay: -.15s; }
  .spinner i:nth-child(3) { animation-delay: -.30s; }
  .spinner i:nth-child(4) { animation-delay: -.45s; }
  .spinner i:nth-child(5) { animation-delay: -.60s; }
  @keyframes caOrbit { from { transform: rotate(0deg) translateY(-17px); } to { transform: rotate(360deg) translateY(-17px); } }

  .ver { position: absolute; right: 14px; bottom: 10px; z-index: 3;
         font: 500 11px "Segoe UI", system-ui, sans-serif; color: rgba(225, 248, 255, .55);
         letter-spacing: .4px; user-select: none; text-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
  .credit { position: absolute; left: 14px; bottom: 10px; z-index: 3;
            font: 500 11px "Segoe UI", system-ui, sans-serif; color: rgba(225, 238, 255, .62);
            letter-spacing: .3px; user-select: none; text-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
</style>
<div class="wrap">
  <video id="vid" src="splash.mp4" poster="splash-poster.png" autoplay muted playsinline></video>
  <div class="shade"></div>
  <div class="brand">
    <div class="brand-title">Caption <span class="accent">assistance</span></div>
    <div class="tag">Listen. Understand. Respond.</div>
  </div>
  <div class="spinner"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="credit">Haru Mikage · Japan · 2026.8.15</div>
  <div class="ver" id="ver"></div>
</div>
<script>
  // keep the last frame if the video finishes before the app window is ready (no loop restart / black flash)
  var v = document.getElementById('vid');
  if (v) { v.addEventListener('ended', function () { try { v.pause(); v.currentTime = Math.max(0, v.duration - 0.05); } catch (e) {} }); if (v.play) v.play().catch(function () {}); }
</script>
